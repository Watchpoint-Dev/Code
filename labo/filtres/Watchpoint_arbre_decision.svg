<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 700 1150" preserveAspectRatio="xMidYMid meet" role="img">
<title>Watchpoint, arbre de decision du filtrage</title>
<desc>Neuf portes appliquees au titre d'un lot, menant a trois verdicts : rejeter, garder, quarantaine.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.t  { font-size: 14px; fill: #1A1A1A; }
.ts { font-size: 12px; fill: #5F6368; }
.th { font-size: 14px; font-weight: bold; fill: #1A1A1A; }
.h1 { font-size: 17px; font-weight: bold; fill: #1B2A4A; }
.h2 { font-size: 12px; fill: #6B6B6B; }
.box { fill: #F4F6F9; stroke: #9AA4B2; stroke-width: 0.9; }
.arr { stroke: #5F6368; stroke-width: 1.2; fill: none; }
.c-gray  rect { fill: #F1F0EC; stroke: #B4B2A9; stroke-width: 0.9; }
.c-red   rect { fill: #FBEAEA; stroke: #B3261E; stroke-width: 0.9; }
.c-red   .th  { fill: #7A1A15; }
.c-red   .ts  { fill: #9B3A34; }
.c-green rect { fill: #E9F3EA; stroke: #2E7D32; stroke-width: 0.9; }
.c-green .th  { fill: #1B5E20; }
.c-green .ts  { fill: #3D7A42; }
.c-amber rect { fill: #FDF3E0; stroke: #B8860B; stroke-width: 0.9; }
.c-amber .th  { fill: #7A5A08; }
</style>
<rect x="0" y="0" width="700" height="1150" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="h1" x="20" y="30">Watchpoint, arbre de decision du filtrage</text>
<text class="h2" x="20" y="50">Applique au titre du lot. Les portes sont evaluees dans cet ordre, sans exception.</text>
<line x1="20" y1="62" x2="680" y2="62" stroke="#1B2A4A" stroke-width="1"/>

<g transform="translate(10,64)">

<g class="c-gray"><rect x="255" y="16" width="170" height="36" rx="8"/><text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Titre du lot</text></g>
<line x1="340" y1="52" x2="340" y2="72" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,74 500,110 340,146 180,110"/>
<text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">R1 . Exclusion dure ?</text>
<text class="ts" x="8" y="104">Horloge, bijou, stylo,</text>
<text class="ts" x="8" y="120">smartwatch, lot multiple</text>
<text class="ts" x="512" y="94">Oui</text>
<line x1="500" y1="110" x2="536" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="91" width="130" height="38" rx="8"/><text class="th" x="605" y="110" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="160">Non</text>
<line x1="340" y1="146" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,172 500,208 340,244 180,208"/>
<text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">R2 . Negation categorie ?</text>
<text class="ts" x="8" y="202">no watch, sans montre,</text>
<text class="ts" x="8" y="218">ohne Uhr</text>
<text class="ts" x="512" y="192">Oui</text>
<line x1="500" y1="208" x2="536" y2="208" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="189" width="130" height="38" rx="8"/><text class="th" x="605" y="208" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="258">Non</text>
<line x1="340" y1="244" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,270 500,306 340,342 180,306"/>
<text class="th" x="340" y="306" text-anchor="middle" dominant-baseline="central">R3 . Aucune marque ?</text>
<text class="ts" x="8" y="300">Porte positive. Test du</text>
<text class="ts" x="8" y="316">libelle le plus long d'abord</text>
<text class="ts" x="512" y="290">Oui</text>
<line x1="500" y1="306" x2="536" y2="306" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="287" width="130" height="38" rx="8"/><text class="th" x="605" y="306" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="356">Non</text>
<line x1="340" y1="342" x2="340" y2="366" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,368 500,404 340,440 180,404"/>
<text class="th" x="340" y="404" text-anchor="middle" dominant-baseline="central">R3b . Poche non admise ?</text>
<text class="ts" x="8" y="398">Poche acceptee seulement</text>
<text class="ts" x="8" y="414">si la maison en produisait</text>
<text class="ts" x="512" y="388">Oui</text>
<line x1="500" y1="404" x2="536" y2="404" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="385" width="130" height="38" rx="8"/><text class="th" x="605" y="404" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="454">Non</text>
<line x1="340" y1="440" x2="340" y2="464" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,466 500,502 340,538 180,502"/>
<text class="th" x="340" y="502" text-anchor="middle" dominant-baseline="central">R4 . Token manquant ?</text>
<text class="ts" x="8" y="496">Chanel, Cartier, Zodiac :</text>
<text class="ts" x="8" y="512">le mot montre est exige</text>
<text class="ts" x="512" y="486">Oui</text>
<line x1="500" y1="502" x2="536" y2="502" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="483" width="130" height="38" rx="8"/><text class="th" x="605" y="502" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="552">Non</text>
<line x1="340" y1="538" x2="340" y2="562" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,564 500,600 340,636 180,600"/>
<text class="th" x="340" y="600" text-anchor="middle" dominant-baseline="central">R5 . Terme vendu seul ?</text>
<text class="ts" x="8" y="594">Conditionnel accompagne</text>
<text class="ts" x="8" y="610">de only, seul, nur</text>
<text class="ts" x="512" y="584">Oui</text>
<line x1="500" y1="600" x2="536" y2="600" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="540" y="581" width="130" height="38" rx="8"/><text class="th" x="605" y="600" text-anchor="middle" dominant-baseline="central">Rejeter</text></g>
<text class="ts" x="352" y="650">Non</text>
<line x1="340" y1="636" x2="340" y2="660" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,662 500,698 340,734 180,698"/>
<text class="th" x="340" y="698" text-anchor="middle" dominant-baseline="central">R6 . Set decrit ?</text>
<text class="ts" x="8" y="692">Conditionnel accompagne</text>
<text class="ts" x="8" y="708">de no box, avec, full set</text>
<text class="ts" x="512" y="682">Oui</text>
<line x1="500" y1="698" x2="536" y2="698" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="540" y="679" width="130" height="38" rx="8"/><text class="th" x="605" y="691" text-anchor="middle" dominant-baseline="central">Garder</text><text class="ts" x="605" y="707" text-anchor="middle" dominant-baseline="central">set renseigne</text></g>
<text class="ts" x="352" y="748">Non</text>
<line x1="340" y1="734" x2="340" y2="758" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,760 500,796 340,832 180,796"/>
<text class="th" x="340" y="796" text-anchor="middle" dominant-baseline="central">R7 . Conditionnel nu ?</text>
<text class="ts" x="8" y="790">bracelet, cadran, boitier</text>
<text class="ts" x="8" y="806">sans aucun marqueur</text>
<text class="ts" x="510" y="780">Non</text>
<line x1="500" y1="796" x2="536" y2="796" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="540" y="777" width="130" height="38" rx="8"/><text class="th" x="605" y="796" text-anchor="middle" dominant-baseline="central">R8 . Garder</text></g>
<text class="ts" x="352" y="846">Oui</text>
<line x1="340" y1="832" x2="340" y2="856" class="arr" marker-end="url(#arrow)"/>

<polygon class="box" points="340,858 500,894 340,930 180,894"/>
<text class="th" x="340" y="894" text-anchor="middle" dominant-baseline="central">R7a . Token ou enchere ?</text>
<text class="ts" x="8" y="888">En enchere le vocabulaire</text>
<text class="ts" x="8" y="904">de piece est descriptif</text>
<text class="ts" x="512" y="878">Oui</text>
<line x1="500" y1="894" x2="536" y2="894" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="540" y="875" width="130" height="38" rx="8"/><text class="th" x="605" y="894" text-anchor="middle" dominant-baseline="central">Garder</text></g>
<text class="ts" x="352" y="944">Non</text>
<line x1="340" y1="930" x2="340" y2="962" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="255" y="964" width="170" height="38" rx="8"/><text class="th" x="340" y="983" text-anchor="middle" dominant-baseline="central">Quarantaine</text></g>

</g>

<line x1="20" y1="1094" x2="680" y2="1094" stroke="#D9D9D9" stroke-width="1"/>
<rect x="20" y="1114" width="12" height="12" rx="3" fill="#FBEAEA" stroke="#B3261E" stroke-width="0.9"/>
<text class="ts" x="38" y="1124">Rejet definitif, journalise</text>
<rect x="200" y="1114" width="12" height="12" rx="3" fill="#E9F3EA" stroke="#2E7D32" stroke-width="0.9"/>
<text class="ts" x="218" y="1124">Ingere en base</text>
<rect x="340" y="1114" width="12" height="12" rx="3" fill="#FDF3E0" stroke="#B8860B" stroke-width="0.9"/>
<text class="ts" x="358" y="1124">Quarantaine, echantillonnee chaque semaine</text>
</svg>
