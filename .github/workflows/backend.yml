name: Backend

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      # Le banc du filtre (76 cas), le parsing, les regles d'architecture.
      # Aucune requete reseau, aucune donnee necessaire : filters.json est versionne.
      - name: Tests
        run: pytest backend
